<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AGORA - consola de decisiones tipadas</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg?v=2">
  <link rel="shortcut icon" type="image/svg+xml" href="favicon.svg?v=2">
  <link rel="apple-touch-icon" href="favicon.svg?v=2">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <div class="marca">
        <img class="logo" src="favicon.svg" alt="" width="34" height="34">
        <h1>AGORA</h1>
      </div>
      <p class="sub">Consola de decisiones tipadas. El estado es dato, nunca orden.</p>
    </div>
    <div class="chips">
      <span class="chip" id="chip-servicio">servicio</span>
      <span class="chip" id="chip-backends">backends</span>
      <span class="chip acento" id="chip-parte">GENERAL</span>
    </div>
  </header>

  <main class="grid">
    <section class="panel">
      <h2>Entrada</h2>

      <div class="fila">
        <label>Parte
          <select id="parte">
            <option value="GENERAL">GENERAL</option>
            <option value="SOC">SOC-SIEM</option>
          </select>
        </label>
        <label>Pack
          <select id="pack"></select>
        </label>
        <label>Backend
          <select id="backend"></select>
        </label>
      </div>

      <label class="bloque">Estado
        <span class="muted">JSON; contenido no confiable, nunca instruccion</span>
        <textarea id="estado" rows="9" spellcheck="false">{}</textarea>
      </label>

      <div class="fila acciones">
        <button id="ejemplo" class="ghost" type="button">Ejemplo</button>
        <label class="check"><input type="checkbox" id="comparar"> comparar backends</label>
        <button id="decidir" class="primary" type="button">Decidir</button>
      </div>

      <h3 class="sec">Preguntas del pack</h3>
      <div id="preguntas" class="preguntas"></div>
    </section>

    <section class="panel">
      <h2>Resultado <span id="salida-estado" class="muted"></span></h2>
      <div id="tarjetas" class="tarjetas">
        <p class="vacio">Elige parte, pack y estado, y pulsa Decidir.</p>
      </div>

      <details class="traza">
        <summary>Traza (contrato: backend, modelo y orden canonico)</summary>
        <pre id="traza">(sin traza todavia)</pre>
      </details>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
