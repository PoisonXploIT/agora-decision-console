<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="AGORA">
  <defs>
    <linearGradient id="ac" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.34" r="0.62">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- placa -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#0d1117"/>
  <rect x="2.9" y="2.9" width="58.2" height="58.2" rx="13.2" fill="none"
        stroke="#26303b" stroke-width="1.6"/>
  <circle cx="32" cy="26" r="24" fill="url(#glow)"/>

  <!-- fronton (pedimento) -->
  <path d="M32 9.5 L55 24.5 L9 24.5 Z" fill="url(#ac)"/>
  <!-- arquitrabe -->
  <rect x="11.5" y="26" width="41" height="3.4" rx="1.2" fill="#9fe8ff" opacity="0.92"/>
  <!-- columnas -->
  <g fill="url(#ac)">
    <rect x="14.5" y="32" width="4.6" height="17.4" rx="1.4"/>
    <rect x="24.6" y="32" width="4.6" height="17.4" rx="1.4"/>
    <rect x="34.7" y="32" width="4.6" height="17.4" rx="1.4"/>
    <rect x="44.8" y="32" width="4.6" height="17.4" rx="1.4"/>
  </g>
  <!-- basamento y estilobato -->
  <rect x="11.5" y="50.6" width="41" height="3.2" rx="1.2" fill="#9fe8ff" opacity="0.92"/>
  <rect x="8.5" y="54.6" width="47" height="3" rx="1.4" fill="url(#ac)"/>
</svg>
